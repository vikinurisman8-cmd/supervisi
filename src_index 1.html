<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>Instrumen Supervisi Pembelajaran – SMK Negeri 13 Surabaya</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b2333;--mu:#667085;--bd:#dfe3ec;--pr:#c62828;--pr2:#fdecec;--ok:#1b7f4b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10141c;--card:#181e2a;--tx:#eef1f7;--mu:#97a1b5;--bd:#2b3446;--pr:#ff6b6b;--pr2:#3a1f24;--ok:#4cc38a}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
header img{height:44px}header b{display:block}header small{color:var(--mu)}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{border:0;background:none;color:var(--mu);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--pr2);color:var(--pr);font-weight:600}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
h1{font-size:22px;margin:4px 0 6px}h2{font-size:17px;margin:18px 0 8px;color:var(--pr)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.btn{background:var(--pr);color:#fff;border:0;padding:10px 18px;border-radius:8px;font:inherit;cursor:pointer;margin-top:12px}
.btn.g{background:none;color:var(--pr);border:1px solid var(--pr)}
.it{border-top:1px solid var(--bd);padding:12px 0}.it:first-of-type{border:0}
.it p{margin:0 0 8px}.bw{color:var(--mu);font-size:12px}
.sc{display:grid;grid-template-columns:1fr;gap:6px}
.sc label{margin:0;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer;color:var(--tx);font-size:13px}
.sc input{display:none}.sc label:has(input:checked){background:var(--pr);border-color:var(--pr);color:#fff}
.sc b{font-size:13px}
.sum{display:flex;gap:16px;flex-wrap:wrap;align-items:center}.big{font-size:34px;font-weight:700;color:var(--pr)}
canvas{width:100%;height:160px;border:1px dashed var(--bd);border-radius:8px;background:#fff;touch-action:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:600px){.row{grid-template-columns:1fr}}
#pr{display:none;background:#fff;color:#000;padding:16px}#pr img.k{width:100%}#pr table{width:100%;border-collapse:collapse;font-size:11px;margin:6px 0}#pr td,#pr th{border:1px solid #000;padding:3px 5px;text-align:left}#pr .sg img{height:70px}#pr .sg td{border:0;text-align:center;width:50%;font-size:12px}
@media print{body>:not(#pr){display:none!important}#pr{display:block!important;padding:0}}
</style></head><body>

["Kerangka Pembelajaran",[["Praktik pedagogis yang dituliskan tergambar pada langkah dan/atau asesmen pembelajaran",5],["Lingkungan belajar yang dituliskan tergambar pada langkah dan/atau asesmen pembelajaran",5],["Kemitraan pembelajaran yang dituliskan tergambar pada langkah dan/atau asesmen pembelajaran",5],["Pemanfaatan digital yang dituliskan tergambar pada langkah dan/atau asesmen pembelajaran",5]]],
["Langkah Pembelajaran",[["Langkah pembelajaran memfasilitasi pengalaman belajar MEMAHAMI (indikator a–f: menghubungkan pengetahuan, menstimulasi berpikir, konteks nyata, eksploratif-kolaboratif, nilai moral/etika, karakter)",7],["Langkah pembelajaran memfasilitasi pengalaman belajar MENGAPLIKASI (indikator a–d: menghubungkan konsep, menerapkan di situasi nyata, eksplorasi lanjut, berpikir kritis dan solusi inovatif)",7],["Langkah pembelajaran memfasilitasi pengalaman belajar MEREFLEKSI (indikator a–e: motivasi diri, evaluasi diri, strategi berpikir, metakognisi, regulasi emosi)",7],["Langkah pembelajaran memfasilitasi tindakan saling MEMULIAKAN (guru-murid, murid-guru, murid-murid), inklusif dan responsif",6],["Prinsip pembelajaran mendalam (berkesadaran, bermakna, menggembirakan) tergambar pada setiap pengalaman belajar",6],["Perencanaan mengakomodasi pengalaman belajar sesuai karakteristik peserta didik",7]]],

const O=[["Profil Lulusan",[["Tujuan pembelajaran mencakup sikap, pengetahuan, dan keterampilan, serta tampak dalam aktivitas yang membangun karakter dan kompetensi murid",5],["Ada kegiatan penilaian untuk melihat ketercapaian profil lulusan yang selaras dengan tujuan pembelajaran",5]]],
["Prinsip Pembelajaran",[["Alur kegiatan jelas, terstruktur, menjaga fokus dan keterlibatan murid",5],["Materi dan aktivitas terkait kehidupan nyata atau pengalaman murid",5],["Aktivitas menarik, menantang, memotivasi, dan menggembirakan murid",5]]],
["Pengalaman Belajar",[["Murid terlibat aktif memahami materi (mengamati, bertanya, berdiskusi, menggali informasi)",7],["Kegiatan mendorong murid menerapkan pengetahuan dalam situasi nyata/kontekstual",7],["Ada kegiatan refleksi: murid menilai proses dan hasil belajar serta merencanakan perbaikan",6]]],

const D={o:[["Tujuan pembelajaran belum mencakup atau belum tampak pada aktivitas sikap, pengetahuan, dan keterampilan.","Tujuan pembelajaran mencakup sebagian aspek dan hanya sebagian aktivitas mendukung pembentukan karakter/kompetensi murid.","Tujuan pembelajaran mencakup sikap, pengetahuan, dan keterampilan serta tampak dalam sebagian besar aktivitas.","Tujuan pembelajaran mencakup sikap, pengetahuan, dan keterampilan serta konsisten diwujudkan dalam aktivitas yang membangun karakter dan kompetensi murid."],["Penilaian belum digunakan untuk melihat ketercapaian profil lulusan atau tidak selaras dengan tujuan pembelajaran.","Penilaian dilakukan secara terbatas dan baru mengukur sebagian profil lulusan serta sebagian tujuan pembelajaran.","Penilaian digunakan untuk melihat ketercapaian sebagian besar profil lulusan dan selaras dengan tujuan pembelajaran.","Penilaian dilakukan secara terencana, beragam, selaras dengan tujuan pembelajaran, dan memberikan bukti ketercapaian profil lulusan."],["Alur pembelajaran tidak jelas, tidak terstruktur, dan banyak murid kehilangan fokus atau tidak terlibat.","Alur pembelajaran cukup terlihat, tetapi beberapa tahapan kurang terhubung dan keterlibatan murid belum konsisten.","Alur pembelajaran jelas dan terstruktur serta mampu menjaga fokus dan keterlibatan sebagian besar murid.","Alur pembelajaran sangat jelas, runtut, fleksibel sesuai kebutuhan, dan konsisten menjaga fokus serta keterlibatan hampir seluruh murid."],["Materi dan aktivitas tidak dikaitkan dengan kehidupan nyata atau pengalaman murid.","Sebagian materi atau aktivitas dikaitkan dengan pengalaman/konteks nyata, tetapi belum mendalam.","Sebagian besar materi dan aktivitas dikaitkan dengan kehidupan nyata atau pengalaman murid.","Materi dan aktivitas secara konsisten menggunakan konteks kehidupan nyata/pengalaman murid sehingga pembelajaran terasa relevan dan bermakna."],["Pembelajaran cenderung monoton, kurang menantang, dan belum membangkitkan motivasi atau kegembiraan murid.","Beberapa aktivitas menarik atau menantang, tetapi motivasi dan kegembiraan murid belum merata.","Aktivitas cukup menarik dan menantang serta mampu memotivasi dan menggembirakan sebagian besar murid.","Aktivitas sangat variatif, menarik, menantang, dan menyenangkan serta konsisten membangkitkan motivasi hampir seluruh murid."],["Murid pasif dan didominasi guru","Hanya beberapa murid aktif","Sebagian besar murid aktif","Hampir seluruh murid aktif bertanya, berdiskusi, mencari informasi, dan mengemukakan pendapat"],["Murid belum diberi kesempatan atau belum mampu menerapkan pengetahuan pada situasi nyata/kontekstual.","Sebagian murid diberi kesempatan menerapkan pengetahuan, tetapi konteks yang digunakan masih terbatas.","Sebagian besar murid menerapkan pengetahuan melalui tugas/aktivitas yang relevan dengan situasi nyata.","Hampir seluruh murid secara aktif menerapkan pengetahuan untuk memecahkan masalah atau menghasilkan karya dalam konteks nyata."],["Refleksi belum dilakukan atau hanya berupa penutupan tanpa menilai proses dan hasil belajar.","Refleksi dilakukan secara terbatas; hanya sebagian murid menilai proses/hasil belajar dan merencanakan perbaikan.","Sebagian besar murid melakukan refleksi terhadap proses dan hasil belajar serta mengidentifikasi perbaikan.","Hampir seluruh murid melakukan refleksi mendalam, menilai proses dan hasil belajar, serta menetapkan langkah perbaikan yang konkret."],["Strategi/metode pembelajaran tidak jelas atau tidak sesuai dengan tujuan pembelajaran.","Strategi/metode pembelajaran sudah ditentukan tetapi penerapannya sebagian belum sesuai dengan tujuan.","Strategi/metode pembelajaran jelas dan sesuai dengan sebagian besar tujuan serta karakteristik materi/murid.","Strategi/metode dipilih secara tepat, diterapkan konsisten, adaptif terhadap kebutuhan murid, dan efektif mencapai tujuan pembelajaran."],["Interaksi satu arah dan kerja sama guru-murid maupun antar murid belum tampak.","Interaksi dan kerja sama terjadi secara terbatas dan hanya melibatkan sebagian murid.","Interaksi dua arah dan kerja sama antarmurid maupun guru-murid berlangsung dengan baik pada sebagian besar kegiatan.","Interaksi berlangsung aktif, dialogis, dan kolaboratif; hampir seluruh murid berkontribusi dan saling mendukung."],["Suasana kelas kurang aman/nyaman, ketertiban belum terkelola, dan menghambat proses belajar.","Suasana kelas cukup aman dan tertib, tetapi masih terdapat gangguan atau murid yang kurang nyaman.","Suasana kelas aman, nyaman, tertib, dan mendukung sebagian besar proses belajar.","Suasana kelas sangat aman, nyaman, inklusif, tertib, dan positif sehingga hampir seluruh murid merasa dihargai dan siap belajar."],["Tidak menggunakan teknologi","Teknologi digunakan namun kurang bermakna","Teknologi digunakan dan mendukung pembelajaran","Teknologi digunakan efektif dan meningkatkan kualitas pembelajaran"],["Interaksi menunjukkan kurangnya sikap saling menghargai; masih terdapat perilaku yang mengganggu atau merendahkan.","Sebagian murid menunjukkan sikap saling menghargai, tetapi belum konsisten dalam seluruh interaksi.","Sebagian besar murid saling menghargai dan menghormati dalam interaksi belajar.","Hampir seluruh murid konsisten menunjukkan sikap saling menghargai, menghormati, empati, dan memuliakan satu sama lain."],["Murid belum memahami tujuan pembelajaran dan tidak mengaitkan materi dengan pengalaman sebelumnya.","Sebagian murid memahami tujuan pembelajaran atau mampu mengaitkan materi dengan pengalaman sebelumnya.","Sebagian besar murid memahami tujuan pembelajaran dan mengaitkan materi dengan pengalaman sebelumnya.","Hampir seluruh murid memahami tujuan pembelajaran, menjelaskan relevansinya, dan secara aktif mengaitkan materi dengan pengalaman/pengetahuan sebelumnya."],["Murid belum diberi pilihan cara belajar dan masih sangat bergantung pada guru; refleksi diri belum tampak.","Sebagian murid mendapat pilihan cara belajar dan menunjukkan kepercayaan diri, tetapi refleksi diri masih terbatas.","Sebagian besar murid memiliki kesempatan memilih cara belajar, menunjukkan percaya diri, dan melakukan refleksi diri.","Hampir seluruh murid mampu memilih strategi/cara belajar yang sesuai, percaya diri, bertanggung jawab, dan menggunakan refleksi diri untuk memperbaiki belajar."],["Tujuan pembelajaran belum tercapai oleh sebagian besar murid dan belum terlihat penyesuaian dengan kemampuan/perkembangan murid.","Sebagian murid mencapai tujuan pembelajaran; penyesuaian terhadap kemampuan/perkembangan murid masih terbatas.","Sebagian besar murid mencapai tujuan pembelajaran sesuai kemampuan dan perkembangannya.","Hampir seluruh murid mencapai tujuan pembelajaran; guru menggunakan bukti belajar untuk menyesuaikan pembelajaran dengan kebutuhan dan perkembangan murid."],["Murid belum menunjukkan kemandirian dan aktivitas belajar belum terkait dengan kehidupan sehari-hari.","Sebagian murid belajar mandiri melalui aktivitas yang relevan, tetapi masih membutuhkan banyak arahan guru.","Sebagian besar murid mampu belajar mandiri melalui aktivitas yang relevan dengan kehidupan sehari-hari.","Hampir seluruh murid menunjukkan kemandirian, inisiatif, dan tanggung jawab melalui aktivitas yang autentik dan relevan dengan kehidupan sehari-hari."],["Guru belum menunjukkan penyesuaian pembelajaran terhadap perbedaan kemampuan, latar belakang, dan kebutuhan belajar murid.","Guru melakukan penyesuaian secara terbatas terhadap sebagian perbedaan kemampuan atau kebutuhan murid.","Guru mengakomodasi sebagian besar perbedaan kemampuan, latar belakang, dan kebutuhan belajar murid.","Guru secara konsisten menerapkan pembelajaran yang inklusif dan diferensiatif sesuai kemampuan, latar belakang, serta kebutuhan belajar hampir seluruh murid."],["Pengelolaan kelas kurang efektif; kegiatan tidak kontekstual dan hubungan antar kegiatan tidak jelas.","Pengelolaan kelas cukup berjalan, tetapi pembelajaran kontekstual dan keterpaduan kegiatan belum konsisten.","Pengelolaan kelas efektif, pembelajaran cukup kontekstual, dan sebagian besar kegiatan saling terhubung.","Pengelolaan kelas sangat efektif, kontekstual, fleksibel, dan seluruh rangkaian kegiatan terpadu untuk mencapai tujuan pembelajaran."],["Refleksi akhir belum dilakukan atau tidak mengacu pada hasil belajar murid.","Refleksi akhir dilakukan tetapi hanya membahas proses secara umum dan belum banyak menggunakan hasil belajar murid.","Refleksi akhir mengacu pada hasil belajar sebagian besar murid dan digunakan untuk mengidentifikasi perbaikan.","Refleksi akhir berbasis bukti hasil belajar murid, melibatkan murid, dan menghasilkan tindak lanjut/perbaikan pembelajaran yang konkret."],["Penilaian formatif selama proses belajar belum dilakukan dan umpan balik belum diberikan.","Penilaian formatif dilakukan secara terbatas dan umpan balik hanya diberikan kepada sebagian murid.","Penilaian formatif dilakukan selama proses belajar dan umpan balik diberikan kepada sebagian besar murid.","Penilaian formatif dilakukan secara berkelanjutan dengan bukti yang relevan; hampir seluruh murid memperoleh umpan balik yang spesifik dan dapat ditindaklanjuti."],["Penilaian akhir belum dilakukan atau belum memberikan informasi tentang ketercapaian tujuan pembelajaran.","Penilaian akhir dilakukan tetapi hanya mengukur sebagian tujuan pembelajaran.","Penilaian akhir mengukur sebagian besar tujuan pembelajaran dengan teknik/instrumen yang sesuai.","Penilaian akhir dirancang selaras dengan seluruh tujuan pembelajaran, menggunakan teknik yang sesuai, dan menghasilkan bukti ketercapaian yang jelas."],["Hasil penilaian belum dianalisis atau belum digunakan untuk memperbaiki pembelajaran/tindak lanjut.","Hasil penilaian digunakan secara terbatas untuk memperbaiki pembelajaran atau memberi tindak lanjut kepada sebagian murid.","Hasil penilaian dianalisis dan digunakan untuk perbaikan pembelajaran serta tindak lanjut bagi sebagian besar murid.","Hasil penilaian dianalisis secara sistematis dan digunakan untuk pembelajaran terdiferensiasi, remedial/pengayaan, serta perbaikan berkelanjutan."],["Arah pembelajaran belum tampak selaras dengan visi sekolah dan belum berpusat pada murid.","Sebagian kegiatan selaras dengan visi sekolah dan mulai berpusat pada murid, tetapi belum konsisten.","Sebagian besar kegiatan selaras dengan visi sekolah dan menunjukkan pembelajaran yang berpusat pada murid.","Seluruh arah pembelajaran konsisten selaras dengan visi sekolah, kebutuhan murid, dan pengembangan potensi murid sebagai subjek utama belajar."],["Refleksi dan upaya perbaikan pembelajaran belum dilakukan.","Refleksi dilakukan secara terbatas dan tindak perbaikan belum sistematis.","Guru melakukan refleksi dan menerapkan sebagian hasilnya untuk memperbaiki pembelajaran berikutnya.","Guru melakukan refleksi berbasis bukti secara konsisten, melibatkan umpan balik murid/hasil asesmen, dan melaksanakan perbaikan pembelajaran secara berkelanjutan."]],t:[["Tidak tampak keterkaitan dengan Profil Lulusan","Hanya satu atau dua komponen yang mengarah pada Profil Lulusan","Sebagian besar sudah mengarah pada Profil Lulusan","Ketiganya secara eksplisit mengembangkan dimensi Profil Lulusan"],["Tidak ada keselarasan yang jelas","Terdapat ketidaksesuaian antara tujuan, kegiatan, dan asesmen","Sebagian besar sudah selaras","Seluruh komponen saling mendukung dan terhubung secara utuh"],["Tidak tampak dalam langkah pembelajaran","Strategi hanya tampak sebagian","Sebagian besar strategi tergambar","Strategi/metode pembelajaran tertulis jelas dan konsisten diterapkan"],["Tidak tergambar","Hanya beberapa unsur yang tampak","Sebagian besar unsur lingkungan belajar tergambar","Lingkungan belajar aman, inklusif, kolaboratif tergambar jelas"],["Tidak ada kemitraan","Kemitraan hanya disebutkan","Ada rencana kemitraan namun belum optimal","Melibatkan orang tua, dunia kerja, komunitas atau narasumber secara nyata"],["Tidak memanfaatkan teknologi","Teknologi hanya sebagai pelengkap","Teknologi digunakan tetapi belum optimal","Teknologi digunakan secara bermakna mendukung pembelajaran"],["Tidak memenuhi indikator","Memenuhi 1–2 indikator","Memenuhi 3–4 indikator","Memenuhi ≥5 indikator (a-f)"],["Tidak tampak","Memenuhi 1–2 indikator","Memenuhi 3 indikator","Memenuhi seluruh indikator a-d"],["Tidak ada refleksi","Memenuhi 1–2 indikator","Memenuhi 3 indikator","Memenuhi ≥4 indikator refleksi"],["Tidak tampak","Hanya muncul secara implisit","Sebagian besar sudah tampak","Interaksi menghargai dan inklusif dirancang secara eksplisit"],["Tidak tampak","Hanya satu prinsip muncul","Dua prinsip muncul kuat","Ketiga prinsip muncul konsisten pada seluruh aktivitas"],["Tidak mempertimbangkan karakteristik peserta didik","Akomodasi masih terbatas","Sebagian besar kebutuhan terakomodasi","Diferensiasi dan kebutuhan belajar sangat jelas"],["Tidak ada asesmen awal","Mengukur satu aspek","Mengukur dua aspek","Mengukur kesiapan emosional, pengetahuan awal, dan kebutuhan belajar"],["Tidak ada asesmen proses","Ada asesmen tanpa umpan balik","Ada asesmen dan umpan balik","Beragam teknik dan umpan balik berkelanjutan"],["Tidak jelas","Hanya satu teknik","Menggunakan lebih dari satu teknik","Menggunakan beragam bukti autentik"]]};

<h3 style="text-align:center">INSTRUMEN SUPERVISI PEMBELAJARAN</h3>
<table><tr><td>SMK</td><td>${esc(I.sekolah)}</td><td>Tanggal Telaah</td><td>${esc(I.tglT)}</td></tr><tr><td>Alamat</td><td>${esc(I.alamat)}</td><td>Tanggal Observasi</td><td>${esc(I.tglO)}</td></tr><tr><td>Nama Guru</td><td>${esc(I.guru)}</td><td>Penelaah/Observer</td><td>${esc(I.penelaah)}</td></tr><tr><td>Mata Pelajaran</td><td>${esc(I.mapel)}</td><td>Kelas/Fase</td><td>${esc(I.kelas)}</td></tr><tr><td>Tautan Perencanaan</td><td colspan="3">${esc(I.tautan)}</td></tr></table>
<p><b>Nilai Akhir: ${fin()}/100 (${kat(fin())})</b> — Perencanaan (40%): ${part("t")} · Pelaksanaan (60%): ${part("o")}</p>
<p><b>A. Telaah Perencanaan Pembelajaran</b></p>${tbl("t",G)}${fb("t","Perencanaan",FT)}
<p style="page-break-before:always"><b>B. Observasi Pelaksanaan Pembelajaran</b></p>${tbl("o",O)}${fb("o","Pelaksanaan",FO)}
<p style="text-align:right;margin:18px 0 0">Surabaya, ${tglId(tglIso())}</p><table class="sg"><tr><td>Guru<br>${S.sg.g?`<img src="${S.sg.g}">`:"<br><br><br>"}<br><b><u>${esc(I.guru)||"……………………"}</u></b><br>NIP. ${esc(I.nipG)||"-"}</td><td>Penelaah/Observer<br>${S.sg.p?`<img src="${S.sg.p}">`:"<br><br><br>"}<br><b><u>${esc(I.penelaah)||"……………………"}</u></b><br>NIP. ${esc(I.nipP)||"-"}</td></tr></table>`;
setTimeout(()=>print(),150)}
function kirim(){const st=document.getElementById("st"),I=S.id;
if(REKAP_URL.indexOf("http")!=0){st.textContent="Alamat rekap belum diatur di file aplikasi.";return}
if(!I.guru||!I.penelaah){st.textContent="Isi Nama Guru dan Nama Penelaah di halaman Identitas dulu.";return}
if(cnt("t")<15||cnt("o")<25){if(!confirm("Masih ada butir yang belum diisi (Telaah "+cnt("t")+"/15, Observasi "+cnt("o")+"/25). Tetap kirim?"))return}
const d={kunci:REKAP_KUNCI,sekolah:I.sekolah,guru:I.guru,mapel:I.mapel,kelas:I.kelas,tglT:I.tglT,tglO:I.tglO,penelaah:I.penelaah,nT:part("t"),nO:part("o"),nilai:fin(),kategori:kat(fin()),tautan:I.tautan,nipG:I.nipG||"",nipP:I.nipP||"",tglTtd:tglIso(),sT:flat(G).map((_,i)=>S.t[i]||"-").join(","),sO:flat(O).map((_,i)=>S.o[i]||"-").join(","),cat:[0,1,2].map(j=>"T"+(j+1)+": "+(S.fb["t"+j]||"-")).concat([0,1,2].map(j=>"O"+(j+1)+": "+(S.fb["o"+j]||"-"))).join(" | ")};
st.textContent="Mengirim...";
fetch(REKAP_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(d)}).then(()=>{st.textContent="Terkirim. Cek lembar Rekap untuk memastikan."}).catch(()=>{st.textContent="Gagal mengirim. Periksa koneksi internet."})}
nav();render();
</script></body></html>
